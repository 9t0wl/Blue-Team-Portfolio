<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eccb63"/>
      <stop offset="1" stop-color="#8a7433"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="10" fill="#0c0a07"/>

  <!-- the lens -->
  <circle cx="27" cy="26" r="14" fill="none" stroke="url(#brass)" stroke-width="5"/>
  <circle cx="27" cy="26" r="9.5" fill="#f0b95a" opacity="0.14"/>

  <!-- the handle -->
  <path d="M37.5 36.5 L51 50" stroke="url(#brass)" stroke-width="6" stroke-linecap="round"/>

  <!-- detection pulse, read through the glass -->
  <path d="M19 27 h4 l3-7 4 14 3-7 h4"
        fill="none" stroke="#58a48c" stroke-width="2.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
