    <title>The Detective’s Lodge · 9t0wl — SOC Analyst</title>
    <script>
      // Restore path from 404.html redirect. 404.html encodes the real path as
      // ?p=<path>&q=<query>, not the bare ?/<path> the original spa-github-pages
      // trick uses -- this has to match that exact format or it's a silent no-op.
      (function(l) {
        var search = l.search.slice(1);
        if (search.indexOf('p=') === 0) {
          var qIndex = search.indexOf('&q=');
          var pPart = qIndex === -1 ? search.slice(2) : search.slice(2, qIndex);
          var qPart = qIndex === -1 ? '' : search.slice(qIndex + 3);
          window.history.replaceState(null, null,
            l.pathname + pPart.replace(/~and~/g, '&') +
            (qPart ? '?' + qPart.replace(/~and~/g, '&') : '') +
            l.hash
          );
        }
      }(window.location));
    </script>
    <link rel="icon" type="image/svg+xml" href="/Blue-Team-Portfolio/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
